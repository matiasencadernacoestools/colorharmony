name: Atualizar lista de presets

on:
  push:
    branches: [main]
    paths:
      - "PRESETS/**"
      - "scripts/generate_presets.py"
      - ".github/workflows/update-presets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-presets:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar presets.json
        run: python scripts/generate_presets.py

      - name: Gravar atualização
        run: |
          if git diff --quiet presets.json; then
            echo "presets.json já está atualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presets.json
          git commit -m "Atualizar lista automática de presets"
          git push
