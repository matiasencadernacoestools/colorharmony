name: Atualizar presets e índice cromático

on:
  push:
    branches: [main]
    paths:
      - "PRESETS/**"
      - "scripts/generate_presets.py"
      - ".github/workflows/update-presets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-presets:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pillow pillow-avif-plugin

      - name: Gerar lista e índice cromático
        run: python scripts/generate_presets.py

      - name: Validar ficheiros gerados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          presets = json.loads(Path("presets.json").read_text(encoding="utf-8"))
          index = json.loads(Path("preset-color-index.json").read_text(encoding="utf-8"))

          assert len(presets["files"]) == index["presetCount"]
          assert index["presetCount"] == index["indexedCount"]
          assert not index["errors"]

          print(f'{index["indexedCount"]} preset(s) indexado(s) com sucesso.')
          PY

      - name: Gravar atualização
        run: |
          if git diff --quiet presets.json preset-color-index.json; then
            echo "Lista e índice cromático já estão atualizados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presets.json preset-color-index.json
          git commit -m "Atualizar presets e índice cromático"
          git push
